<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pixel Run: Fight Corruption</title>
  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }
    #gameContainer {
      position: relative;
    }
    canvas {
      background: linear-gradient(#2c2c2c, #111);
      border: 4px solid #ffcc00;
    }
    #healthBar {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 150px;
      height: 15px;
      border: 2px solid #fff;
      background: #333;
    }
    #health {
      height: 100%;
      width: 100%;
      background: #ff4444;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="healthBar"><div id="health"></div></div>
    <canvas id="game" width="600" height="300"></canvas>
  </div>  <!-- Background Music -->  <audio id="bgm" loop autoplay>
    <source src="corruption_theme.mp3" type="audio/mpeg">
  </audio>  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const healthUI = document.getElementById("health");

    // Player (Anti-Corruption Hero)
    const player = {
      x: 50,
      y: 220,
      width: 30,
      height: 30,
      dy: 0,
      gravity: 0.8,
      jumpPower: -12,
      grounded: false,
      health: 100
    };

    // Obstacle (Corruption Blocks)
    let obstacle = {
      x: 600,
      y: 240,
      width: 25,
      height: 40,
      speed: 4
    };

    let score = 0;
    let gameOver = false;

    function drawPlayer() {
      ctx.fillStyle = "#00ffcc"; // Hero color
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function drawObstacle() {
      ctx.fillStyle = "#ffcc00"; // Corruption color
      ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    }

    function drawScore() {
      ctx.fillStyle = "white";
      ctx.font = "16px Arial";
      ctx.fillText("Integrity Score: " + score, 400, 20);
    }

    function updatePlayer() {
      player.dy += player.gravity;
      player.y += player.dy;

      if (player.y + player.height >= 260) {
        player.y = 260 - player.height;
        player.dy = 0;
        player.grounded = true;
      }
    }

    function updateObstacle() {
      obstacle.x -= obstacle.speed;
      if (obstacle.x + obstacle.width < 0) {
        obstacle.x = 600;
        score++;
      }
    }

    function checkCollision() {
      if (
        player.x < obstacle.x + obstacle.width &&
        player.x + player.width > obstacle.x &&
        player.y < obstacle.y + obstacle.height &&
        player.y + player.height > obstacle.y
      ) {
        obstacle.x = 600;
        player.health -= 20;
        healthUI.style.width = player.health + "%";
        if (player.health <= 0) {
          gameOver = true;
        }
      }
    }

    function drawGameOver() {
      ctx.fillStyle = "white";
      ctx.font = "24px Arial";
      ctx.fillText("SYSTEM CORRUPTED", 190, 140);
      ctx.font = "14px Arial";
      ctx.fillText("Refresh to Restart", 220, 170);
    }

    function gameLoop() {
     ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        updatePlayer();
        updateObstacle();
        checkCollision();
        drawPlayer();
        drawObstacle();
        drawScore();
        requestAnimationFrame(gameLoop);
      } else {
        drawGameOver();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && player.grounded) {
        player.dy = player.jumpPower;
        player.grounded = false;
      }
    });

    gameLoop();
  </script></body>
</html>
